<!DOCTYPE html>
<html lang="zh-TW">

    :root {

      --bg: #f8fafc;

      --text: #1e293b;
      --muted: #64748b;
      --success: #16a34a;
      --danger: #dc2626;
      --border: #e2e8f0;

    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", "Hiragino Sans", "Yu Gothic", sans-serif; }
    body { background: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
    .container { width: 100%; max-width: 700px; background: var(--card); border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); padding: 28px; align-self: flex-start; }
    h1 { margin: 0 0 8px; font-size: 1.5rem; text-align: center; }
    .subtitle { text-align: center; color: var(--muted); font-size: 0.9rem; margin-bottom: 24px; }
    .stats-bar { display: flex; justify-content: space-around; background: #f1f5f9; padding: 14px; border-radius: 12px; margin-bottom: 24px; font-size: 0.9rem; }
    .stats-bar div { text-align: center; }
    .stats-bar strong { display: block; font-size: 1.3rem; color: var(--primary); margin-bottom: 2px; }
    .mode-grid { display: grid; gap: 12px; margin-bottom: 12px; }
    .btn { background: var(--primary); color: #fff; border: none; padding: 15px 20px; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: 0.2s; width: 100%; }
    .btn:hover { background: var(--primary-hover); }
    .btn-outline { background: transparent; color: var(--primary); border: 2px solid var(--primary); }
    .btn-outline:hover { background: #eef2ff; }
    .btn-danger { background: var(--danger); }
    .btn-danger:hover { background: #b91c1c; }
    .btn-sm { padding: 8px 14px; font-size: 0.85rem; width: auto; }
    .hidden { display: none !important; }

    /* 測驗區 */
    .quiz-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; font-size: 0.9rem; color: var(--muted); gap: 8px; }
    .badge { padding: 4px 10px; border-radius: 99px; font-size: 0.75rem; font-weight: 600; }
    .badge-review { background: #fee2e2; color: var(--danger); }
    .badge-new { background: #e0e7ff; color: var(--primary); }
    .badge-mastered { background: #dcfce7; color: var(--success); }
    .question-box { text-align: center; padding: 32px 16px; background: #f8fafc; border-radius: 12px; margin-bottom: 20px; border: 1px solid var(--border); }
    .question-text { font-size: 2rem; font-weight: 700; margin: 0; line-height: 1.4; }
    .pos-tag { display: inline-block; background: #e2e8f0; color: #475569; font-size: 0.78rem; padding: 2px 8px; border-radius: 6px; margin-top: 8px; }
    .options-grid { display: grid; gap: 12px; }
    .option-btn { background: #fff; border: 2px solid var(--border); padding: 14px 18px; border-radius: 10px; font-size: 1.1rem; text-align: left; cursor: pointer; transition: 0.15s; color: var(--text); }
    .option-btn:hover:not(:disabled) { border-color: var(--primary); background: #f5f3ff; }
    .option-btn.correct { background: #dcfce7; border-color: var(--success); color: #14532d; font-weight: 600; }
    .option-btn.wrong { background: #fee2e2; border-color: var(--danger); color: #7f1d1d; }
    .feedback { margin-top: 16px; padding: 14px; border-radius: 8px; text-align: center; font-weight: 600; line-height: 1.5; }

    /* 錯題本與題庫總覽 */
    .mistake-list { max-height: 440px; overflow-y: auto; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 16px; }
    .mistake-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border); }
    .mistake-item:last-child { border-bottom: none; }
    .audio-btn { background: #e0e7ff; color: var(--primary); border: none; border-radius: 50%; width: 38px; height: 38px; font-size: 1.1rem; cursor: pointer; flex-shrink: 0; }
    .audio-btn:hover { background: #c7d2fe; }
    .search-input { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.95rem; margin-bottom: 12px; }
  </style>
</head>

<div class="container">
  <!-- 首頁選單 -->

      <button class="btn btn-outline" style="border-color:#cbd5e1; color:#475569;" onclick="openVocabList()">📚 瀏覽完整單字庫與熟練度</button>
    </div>
  </div>

  <!-- 測驗進行畫面 -->
  <div id="quiz-view" class="hidden">
    <div class="quiz-header">
      <button class="btn btn-outline btn-sm" onclick="goHome()">← 返回主選單</button>
      <span id="q-progress">第 1 / 20 題</span>
      <span id="q-type-badge" class="badge badge-new">新單字</span>
    </div>

    <div class="question-box">
      <p id="q-prompt-label" style="color:var(--muted); font-size:0.85rem; margin:0 0 8px;"></p>
      <div id="q-content" class="question-text"></div>
      <div><span id="q-pos-tag" class="pos-tag"></span></div>
      <div style="margin-top:14px; display:flex; justify-content:center; gap:8px;">
        <button id="q-audio-btn" class="btn btn-outline btn-sm hidden" onclick="playCurrentAudio(0.9)">🔊 正常語速重聽</button>
        <button id="q-audio-slow-btn" class="btn btn-outline btn-sm hidden" onclick="playCurrentAudio(0.65)">🐢 慢速重聽</button>
      </div>
    </div>

    <div id="options-container" class="options-grid"></div>
    <div id="feedback-box" class="feedback hidden"></div>
    <button id="next-btn" class="btn hidden" style="margin-top:16px;" onclick="nextQuestion()">下一題 ➔</button>
  </div>

  <!-- 測驗結算畫面 -->
  <div id="result-view" class="hidden" style="text-align:center;">
    <h2>🎉 測驗完成！</h2>
    <p style="font-size:1.2rem;">本次得分：<strong id="final-score" style="color:var(--primary); font-size:1.8rem;">0</strong> / 20</p>
    <p id="result-summary" style="color:var(--muted); margin-bottom:24px;"></p>
    <div style="display:grid; gap:10px;">
      <button class="btn" onclick="startQuiz(currentMode)">再測驗一輪（同模式）</button>
      <button class="btn btn-outline" onclick="goHome()">返回主選單</button>
    </div>
  </div>

  <!-- 錯題記錄本畫面 -->
  <div id="mistake-view" class="hidden">
    <div class="quiz-header">
      <button class="btn btn-outline btn-sm" onclick="goHome()">← 返回主選單</button>
      <strong>錯誤記錄本</strong>
      <button class="btn btn-danger btn-sm" onclick="clearAllMistakes()">清空錯題</button>
    </div>
    <div id="mistake-list-container" class="mistake-list"></div>
    <div style="text-align:right;">
      <button class="btn btn-outline btn-sm" style="color:var(--danger); border-color:var(--danger);" onclick="resetAllProgress()">重置所有學習紀錄</button>
    </div>
  </div>

  <!-- 完整單字庫檢視畫面 -->

    <div id="vocab-list-container" class="mistake-list"></div>
  </div>
</div>

  // ==========================================
  // 2. 狀態管理與 localStorage 持久化
  // ==========================================
  const STORAGE_KEY = "jlpt_n5_quiz_progress_v1";
  let progress = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");

  function saveProgress() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
    updateStatsUI();
  }

  function getWordStat(id) {
    if (!progress[id]) progress[id] = { seen: 0, wrong: 0 };
    return progress[id];
  }

  function updateStatsUI() {
    const total = vocabData.length;
    let seenCount = 0;
    let mistakeCount = 0;
    vocabData.forEach(w => {
      const s = getWordStat(w.id);
      if (s.seen > 0) seenCount++;
      if (s.wrong > 0) mistakeCount++;
    });
    document.getElementById("stat-total").textContent = total;
    document.getElementById("stat-seen").textContent = seenCount;
    document.getElementById("stat-mistakes").textContent = mistakeCount;
    document.getElementById("btn-mistake-count").textContent = mistakeCount;
  }

  // ==========================================
  // 3. 智慧出題演算法 (前5錯題 + 後15新題/平均題)
  // ==========================================
  let currentMode = "";
  let quizQueue = [];
  let currentIndex = 0;
  let score = 0;

  function shuffle(arr) {
    const copy = [...arr];
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  function startQuiz(mode) {
    currentMode = mode;
    currentIndex = 0;
    score = 0;

    // 模式二僅挑選含有漢字的單字
    const pool = mode === "kanji-to-kana"
      ? vocabData.filter(w => w.kanji && w.kanji.trim() !== "")
      : [...vocabData];

    // 1. 前 5 題：從過去做錯的題目 (wrong > 0) 中隨機抽取最多 5 題
    const mistakePool = shuffle(pool.filter(w => getWordStat(w.id).wrong > 0));
    const selectedMistakes = mistakePool.slice(0, 5).map(w => ({ ...w, qType: "review" }));
    const selectedIds = new Set(selectedMistakes.map(w => w.id));

    // 2. 後 15 題（若錯題不足 5 題則自動補滿至 20 題）：
    const neededCount = 20 - selectedMistakes.length;
    const remainingPool = pool.filter(w => !selectedIds.has(w.id));

    // 優先從「完全沒做過的新單字 (seen === 0)」中隨機抽取
    const unseenPool = shuffle(remainingPool.filter(w => getWordStat(w.id).seen === 0));
    let selectedOthers = unseenPool.slice(0, neededCount).map(w => ({ ...w, qType: "new" }));

    // 當所有新單字都做完後，才從「過去做過但目前無錯誤」的題目中，依出現次數 (seen) 由少到多平均挑選
    if (selectedOthers.length < neededCount) {
      const otherIds = new Set(selectedOthers.map(w => w.id));
      const seenNoMistakePool = shuffle(remainingPool.filter(w => !otherIds.has(w.id)))
        .sort((a, b) => getWordStat(a.id).seen - getWordStat(b.id).seen);
      const extra = seenNoMistakePool
        .slice(0, neededCount - selectedOthers.length)
        .map(w => ({ ...w, qType: "mastered" }));
      selectedOthers = selectedOthers.concat(extra);
    }

    quizQueue = [...selectedMistakes, ...selectedOthers];

    showView("quiz-view");
    renderQuestion();
  }

  // ==========================================
  // 4. 渲染題目與日文語音合成 (優化語音包挑選)
  // ==========================================
  function getJapaneseVoice() {
    if (!("speechSynthesis" in window)) return null;
    const voices = window.speechSynthesis.getVoices();
    const jaVoices = voices.filter(v => v.lang === "ja-JP" || v.lang.startsWith("ja"));
    if (jaVoices.length === 0) return null;

    // 優先挑選 Google 網路語音、Microsoft Natural（微軟自然語音）或 Apple 內建好聽的日文語音
    const preferred = jaVoices.find(v => 
      v.name.includes("Google") || 
      v.name.includes("Natural") || 
      v.name.includes("Kyoko") || 
      v.name.includes("Otoya") ||
      v.name.includes("Microsoft")
    );
    return preferred || jaVoices[0];
  }

  function speakJapanese(text, rate = 0.9) {
    if (!("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = "ja-JP";
    utter.rate = rate;
    
    const bestVoice = getJapaneseVoice();
    if (bestVoice) {
      utter.voice = bestVoice;
    }

    window.speechSynthesis.speak(utter);
  }

  if ("speechSynthesis" in window) {
    window.speechSynthesis.onvoiceschanged = () => {
      getJapaneseVoice();
    };
  }

  function playCurrentAudio(rate = 0.9) {
    const q = quizQueue[currentIndex];
    speakJapanese(q.kana, rate);
  }

  function renderQuestion() {
    const q = quizQueue[currentIndex];
    document.getElementById("q-progress").textContent = `第 ${currentIndex + 1} / ${quizQueue.length} 題`;

    const badge = document.getElementById("q-type-badge");
    if (q.qType === "review") {
      badge.textContent = "錯題複習";
      badge.className = "badge badge-review";
    } else if (q.qType === "new") {
      badge.textContent = "新單字";
      badge.className = "badge badge-new";
    } else {
      badge.textContent = "已熟練循環";
      badge.className = "badge badge-mastered";
    }

    const promptLabel = document.getElementById("q-prompt-label");
    const qContent = document.getElementById("q-content");
    const posTag = document.getElementById("q-pos-tag");
    const audioBtn = document.getElementById("q-audio-btn");
    const slowBtn = document.getElementById("q-audio-slow-btn");

    audioBtn.classList.add("hidden");
    slowBtn.classList.add("hidden");
    posTag.textContent = q.pos;

    if (currentMode === "zh-to-kana") {
      promptLabel.textContent = "請選出對應的日文假名：";
      qContent.textContent = q.zh;
    } else if (currentMode === "kanji-to-kana") {
      promptLabel.textContent = "請選出此日文漢字的正確讀音（假名）：";
      qContent.textContent = q.kanji;
    } else if (currentMode === "audio-to-zh") {
      promptLabel.textContent = "請聆聽發音並選出正確的中文意思：";
      qContent.textContent = "🎧 請聽發音作答";
      audioBtn.classList.remove("hidden");
      slowBtn.classList.remove("hidden");
      speakJapanese(q.kana, 0.9);
    }

    // 產生 4 個不重複的選項（避免同假名或同中文干擾項造成多解）
    let candidateDistractors = [];
    if (currentMode === "kanji-to-kana") {
      // 模式二專用：依送り仮名（字尾平假名）、詞性、音節長度與字首字尾相似度加權排序，打造高鑑別度誘答選項
      const okuriMatch = q.kanji.match(/[ぁ-ん]+$/);
      const qOkuri = okuriMatch ? okuriMatch[0] : "";
      const qFirst = q.kana[0] || "";
      const qLast = q.kana[q.kana.length - 1] || "";

      const scored = vocabData
        .filter(w => w.id !== q.id && w.kana !== q.kana && w.zh !== q.zh)
        .map(w => {
          let score = 0;
          // 1. 最高權重：擁有完全相同的送り仮名（例如「新しい」配「忙しい」「楽しい」，或「開ける」配「閉める」「教える」）
          if (qOkuri && w.kana.endsWith(qOkuri)) score += 50;
          // 2. 無送り仮名的名詞/純漢字詞，優先挑選同樣有漢字且字尾假名相同的單字（防止單憑純假名長相排除）
          if (!qOkuri && w.kanji && w.kanji.trim() !== "") score += 25;
          // 3. 相同詞性（動詞配動詞、い形容詞配い形容詞、名詞配名詞）
          if (w.pos === q.pos) score += 20;
          // 4. 字尾假名相同（例如都是い結尾、る結尾、う段結尾、ん結尾）
          if (w.kana[w.kana.length - 1] === qLast) score += 15;
          // 5. 字首假名相同（頭韻干擾，例如「あつい」配「あまい」「あおい」）
          if (w.kana[0] === qFirst) score += 12;
          // 6. 假名字數長度越接近分數越高（避免一眼看出長短差異）
          const lenDiff = Math.abs(w.kana.length - q.kana.length);
          score += Math.max(0, 12 - lenDiff * 4);
          // 加入微幅隨機擾動，確保同分單字每次出現的誘答組合有變化
          score += Math.random() * 6;
          return { word: w, score };
        })
        .sort((a, b) => b.score - a.score);

      candidateDistractors = scored.map(s => s.word);
    } else {
      candidateDistractors = shuffle(
        vocabData.filter(w => w.id !== q.id && w.kana !== q.kana && w.zh !== q.zh)
      );
    }

    const uniqueDistractors = [];
    const usedTexts = new Set([currentMode === "audio-to-zh" ? q.zh : q.kana]);

    for (const item of candidateDistractors) {
      const label = currentMode === "audio-to-zh" ? item.zh : item.kana;
      if (!usedTexts.has(label)) {
        usedTexts.add(label);
        uniqueDistractors.push(item);
      }
      if (uniqueDistractors.length === 3) break;
    }

    const options = shuffle([q, ...uniqueDistractors]);
    const optionsContainer = document.getElementById("options-container");
    optionsContainer.innerHTML = "";

    options.forEach(opt => {
      const btn = document.createElement("button");
      btn.className = "option-btn";
      btn.textContent = currentMode === "audio-to-zh" ? opt.zh : opt.kana;
      btn.onclick = () => handleAnswer(btn, opt.id === q.id, q);
      optionsContainer.appendChild(btn);
    });

    document.getElementById("feedback-box").classList.add("hidden");
    document.getElementById("next-btn").classList.add("hidden");
  }

  function handleAnswer(selectedBtn, isCorrect, questionWord) {
    const allBtns = document.querySelectorAll(".option-btn");
    allBtns.forEach(b => b.disabled = true);

    const stat = getWordStat(questionWord.id);
    stat.seen += 1;

    const feedbackBox = document.getElementById("feedback-box");
    feedbackBox.classList.remove("hidden");

    const wordDisplay = `${questionWord.kana}${questionWord.kanji ? `（${questionWord.kanji}）` : ""} [${questionWord.pos}] ：${questionWord.zh}`;

    if (isCorrect) {
      selectedBtn.classList.add("correct");
      score++;
      // 若為錯題複習且答對，從錯題狀態移除
      if (stat.wrong > 0) stat.wrong = 0;
      feedbackBox.style.background = "#dcfce7";
      feedbackBox.style.color = "#14532d";
      feedbackBox.textContent = `⭕ 答對了！ ${wordDisplay}`;
    } else {
      selectedBtn.classList.add("wrong");
      stat.wrong += 1;
      const correctText = currentMode === "audio-to-zh" ? questionWord.zh : questionWord.kana;
      allBtns.forEach(b => {
        if (b.textContent === correctText) b.classList.add("correct");
      });
      feedbackBox.style.background = "#fee2e2";
      feedbackBox.style.color = "#7f1d1d";
      feedbackBox.textContent = `❌ 答錯了（已加入錯題本）！正解：${wordDisplay}`;
    }

    speakJapanese(questionWord.kana, 0.9);
    saveProgress();
    document.getElementById("next-btn").classList.remove("hidden");
  }

  function nextQuestion() {
    currentIndex++;
    if (currentIndex < quizQueue.length) {
      renderQuestion();
    } else {
      document.getElementById("final-score").textContent = score;
      document.getElementById("result-summary").textContent = `本輪答對 ${score} 題，答錯 ${quizQueue.length - score} 題。錯題已自動收錄至錯題記錄本，下次測驗前 5 題將優先複習。`;
      showView("result-view");
    }
  }

  // ==========================================
  // 5. 錯題記錄本與完整單字庫
  // ==========================================
  function openMistakeBook() {
    const container = document.getElementById("mistake-list-container");
    const mistakes = vocabData.filter(w => getWordStat(w.id).wrong > 0);

    if (mistakes.length === 0) {
      container.innerHTML = `<p style="text-align:center; color:var(--muted); padding:28px;">目前沒有錯題，繼續保持！🎉</p>`;
    } else {
      container.innerHTML = mistakes.map(w => `
        <div class="mistake-item">
          <div>
            <strong style="font-size:1.1rem;">${w.kana}</strong>
            ${w.kanji ? `<span style="color:var(--primary); margin-left:6px; font-weight:600;">[${w.kanji}]</span>` : ""}
            <span class="pos-tag" style="margin-left:6px;">${w.pos}</span>
            <div style="color:var(--muted); font-size:0.9rem; margin-top:4px;">${w.zh}（累計錯誤 ${getWordStat(w.id).wrong} 次）</div>
          </div>
          <button class="audio-btn" onclick="speakJapanese('${w.kana}', 0.9)" title="聽發音">🔊</button>
        </div>
      `).join("");
    }
    showView("mistake-view");
  }

  function openVocabList() {
    document.getElementById("vocab-search").value = "";
    renderVocabList();
    showView("vocab-view");
  }

  function renderVocabList() {
    const kw = document.getElementById("vocab-search").value.trim().toLowerCase();
    const filtered = kw
      ? vocabData.filter(w => w.kana.includes(kw) || w.kanji.includes(kw) || w.zh.includes(kw))
      : vocabData;

    const container = document.getElementById("vocab-list-container");
    container.innerHTML = filtered.slice(0, 200).map(w => {
      const s = getWordStat(w.id);
      const statusText = s.wrong > 0 ? `<span style="color:var(--danger);">錯題 (${s.wrong}次)</span>` : (s.seen > 0 ? `<span style="color:var(--success);">已練 ${s.seen} 次</span>` : `未練習`);
      return `
        <div class="mistake-item">
          <div>
            <strong>${w.kana}</strong> ${w.kanji ? `<span style="color:var(--primary);">[${w.kanji}]</span>` : ""}
            <span style="color:var(--muted); font-size:0.85rem; margin-left:6px;">${w.zh}</span>
            <div style="font-size:0.78rem; color:var(--muted); margin-top:2px;">${w.pos} ｜ 狀態：${statusText}</div>
          </div>
          <button class="audio-btn" onclick="speakJapanese('${w.kana}', 0.9)">🔊</button>
        </div>
      `;
    }).join("") + (filtered.length > 200 ? `<p style="text-align:center; color:var(--muted); padding:12px;">僅顯示前 200 筆，請使用上方搜尋框篩選</p>` : "");
  }

  function clearAllMistakes() {
    if (!confirm("確定要清空所有錯題記錄嗎？")) return;
    Object.keys(progress).forEach(id => { progress[id].wrong = 0; });
    saveProgress();
    openMistakeBook();
  }

  function resetAllProgress() {
    if (!confirm("警告：這將會清除所有已練習次數與錯題紀錄，確定要重置嗎？")) return;
    progress = {};
    saveProgress();
    openMistakeBook();
  }

  function showView(viewId) {
    ["home-view", "quiz-view", "result-view", "mistake-view", "vocab-view"].forEach(id => {
      document.getElementById(id).classList.add("hidden");
    });
    document.getElementById(viewId).classList.remove("hidden");
    updateStatsUI();
  }

  function goHome() {
    window.speechSynthesis.cancel();
    showView("home-view");
  }

  updateStatsUI();
</script>
</body>
</html>
